<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מייק-כפל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --sky:#D8E9FB; --sky-deep:#B9D6F5; --paper:#FFFFFF; --ink:#1E2A44; --muted:#56637E;
  --rust:#B8461F; --rust-soft:#F6DDD0; --bamboo:#2F7D24; --bamboo-soft:#DDF0D5;
  --wrong:#B83227; --wrong-soft:#F8DAD5; --line:#9DB9DA; --on-accent:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --sky:#13213A; --sky-deep:#1C3050; --paper:#1B2840; --ink:#EAF1FB; --muted:#A9B6CC;
    --rust:#E57A4C; --rust-soft:#4A2A1E; --bamboo:#72C65F; --bamboo-soft:#1F3A22;
    --wrong:#F08070; --wrong-soft:#4A2622; --line:#34507A; --on-accent:#13213A;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --sky:#13213A; --sky-deep:#1C3050; --paper:#1B2840; --ink:#EAF1FB; --muted:#A9B6CC;
  --rust:#E57A4C; --rust-soft:#4A2A1E; --bamboo:#72C65F; --bamboo-soft:#1F3A22;
  --wrong:#F08070; --wrong-soft:#4A2622; --line:#34507A; --on-accent:#13213A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--sky);color:var(--ink);
  font-family:"Varela Round","Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rust);outline-offset:3px}
.num{font-family:"Rubik","Segoe UI",Arial,sans-serif;font-weight:700;direction:ltr;unicode-bidi:isolate}
#app{max-width:520px;margin:0 auto;padding:20px 18px 28px;min-height:100vh;display:flex;flex-direction:column}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.icon-btn{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--paper);
  display:grid;place-items:center;padding:0}
.icon-btn svg{width:26px;height:26px}
.title{font-size:1.5rem;margin:0;font-weight:400}

/* home */
.greet{text-align:center;margin:14px 0 4px;font-size:2.3rem;line-height:1.15;font-weight:400}
.today{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.95rem}
.start-wrap{display:grid;place-items:center;flex:1;min-height:240px}
.start{width:210px;height:210px;border-radius:50%;border:6px solid var(--paper);background:var(--rust);color:var(--on-accent);
  font-size:1.9rem;box-shadow:0 10px 0 var(--sky-deep);transition:transform .12s, box-shadow .12s}
.start:active{transform:translateY(6px);box-shadow:0 4px 0 var(--sky-deep)}
.home-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.panda-card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:10px 12px 12px;width:min(62%,280px);text-align:center}
.panda-card svg{width:100%;height:auto;max-height:170px}
.bubble{font-size:1rem;margin:2px 0 0}
.hist-btn{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:1rem}
.hist-btn svg{width:34px;height:34px}

/* practice */
.progress{height:12px;background:var(--paper);border-radius:999px;overflow:hidden;border:2px solid var(--line);margin:10px 0 14px}
.progress>i{display:block;height:100%;background:var(--bamboo);transition:width .3s}
.exercise{background:var(--paper);border:2px solid var(--line);border-radius:22px;text-align:center;padding:22px 10px;font-size:3.4rem;line-height:1.1}
.answer{margin:14px auto 0;background:var(--paper);border:3px solid var(--ink);border-radius:18px;min-height:76px;
  display:grid;place-items:center;font-size:2.6rem;width:100%}
.answer.ok{border-color:var(--bamboo);background:var(--bamboo-soft)}
.answer.bad{border-color:var(--wrong);background:var(--wrong-soft)}
.feedback{text-align:center;min-height:2em;margin:6px 0;font-size:1.15rem}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.key{height:62px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-family:"Rubik",sans-serif;font-weight:700;font-size:1.6rem}
.key:active{background:var(--sky-deep)}
.key.go{background:var(--bamboo);color:var(--on-accent);border-color:var(--bamboo);font-family:"Varela Round",sans-serif;font-size:1.25rem}
.timer{margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.timer .t{font-size:1.6rem;min-width:2.2ch;text-align:center}
.bar{flex:1;height:14px;border-radius:999px;background:var(--sky);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--bamboo);transition:width .1s linear}
.bar.low>i{background:var(--wrong)}

/* summary */
.dad{width:min(52%,210px);aspect-ratio:2/3;margin:10px auto 0;border-radius:28px;overflow:hidden;border:6px solid var(--paper);box-shadow:0 0 0 4px var(--bamboo)}
.dad.sad{box-shadow:0 0 0 4px var(--wrong)}
.dad img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
.dad-say{text-align:center;font-size:1.5rem;margin:14px 0 0;line-height:1.3}
.replay{display:block;margin:8px auto 0;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-size:1rem}
.big-score{text-align:center;font-size:4rem;margin:6px 0 0;line-height:1}
.center{text-align:center}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:14px;font-size:1.2rem;background:var(--rust);color:var(--on-accent);margin-top:16px}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line)}

/* history */
.chart{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px 12px 10px;margin-top:14px}
.bars{display:flex;align-items:flex-end;gap:6px;height:220px;direction:rtl}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.col .v{font-size:.8rem}
.col .b{width:100%;border-radius:8px 8px 3px 3px;background:var(--bamboo);min-height:4px}
.col .b.mid{background:#D99A1E}
.col .b.low{background:var(--wrong)}
.col .b.none{background:transparent;border:2px dashed var(--line);height:20px}
.days{display:flex;gap:6px;margin-top:6px}
.days span{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
.stats{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.6rem}
.demo{font-size:.9rem;color:var(--muted);text-align:center;margin-top:10px}

/* settings */
.list{background:var(--paper);border:2px solid var(--line);border-radius:22px;margin-top:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:2px solid var(--sky)}
.row:last-child{border-bottom:none}
.row label{flex:1}
.row small{display:block;color:var(--muted);font-size:.85rem}
.row select,.row input[type=time],.row input[type=tel]{background:var(--sky);border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-width:110px}
.row input[type=tel]{width:150px;direction:ltr;text-align:left}
.switch{width:56px;height:32px;border-radius:999px;border:2px solid var(--line);background:var(--sky);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:right .15s,background .15s}
.switch[aria-checked="true"]{background:var(--bamboo-soft);border-color:var(--bamboo)}
.switch[aria-checked="true"]::after{right:27px;background:var(--bamboo)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sky);padding:10px 20px;border-radius:999px;font-size:1rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.section-h{font-size:1rem;color:var(--muted);margin:18px 6px 0;font-weight:400}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
// ---------- storage ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const DEFAULTS = { secondsPerQ:10, dailyGoal:20, minTable:2, maxTable:10, sound:true };
// keep only current settings, so values from older versions (like phone numbers) are dropped from storage
const savedSettings = store.get("mk_settings", {}), settings0 = {};
for (const k in DEFAULTS) settings0[k] = (k in savedSettings) ? savedSettings[k] : DEFAULTS[k];
let settings = settings0;
store.set("mk_settings", settings);
let history = store.get("mk_history", null);
let mistakes = store.get("mk_mistakes", {});

const dayKey = d => d.toISOString().slice(0,10);
function daysAgo(n){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-n); return d; }

// demo data for the preview, so the history screen isn’t empty
if (!history){
  history = {}; const pattern=[72,0,80,85,0,78,88,91,94];
  pattern.forEach((p,i)=>{ if(p){ history[dayKey(daysAgo(9-i))] = {total:20, correct:Math.round(p/5), minutes:6, demo:true}; } });
  store.set("mk_history", history);
}
const today = () => history[dayKey(daysAgo(0))];
function streak(){
  let n=0, i = today() ? 0 : 1;
  while (history[dayKey(daysAgo(i))]){ n++; i++; }
  return n;
}

let actx;
function beep(ok){
  if(!settings.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value = ok?880:220; o.type = ok?"sine":"triangle";
    g.gain.setValueAtTime(.15,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.25);

  }catch(e){}
}

const gearIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;
const backIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`;
const chartIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16v-5"/><path d="M12 16V7"/><path d="M17 16v-8"/></svg>`;

const $app = document.getElementById("app");
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function topbar(title){ return `<div class="topbar"><button class="icon-btn" data-go="home" aria-label="חזרה למסך הבית">${backIcon}</button><h1 class="title">${title}</h1><span style="width:48px"></span></div>`; }

// ---------- home ----------
function greeting(){
  const h = new Date().getHours();
  if (h>=5 && h<12) return "בוקר טוב מייקי";
  if (h>=12 && h<17) return "יום טוב מייקי";
  return "ערב טוב מייקי";
}
function renderHome(){
  stopTimer();
  const t = today(), done = t ? t.total : 0, s = streak();
  const happy = done > 0;
  $app.innerHTML = `
    <div class="topbar"><span></span><button class="icon-btn" data-go="settings" aria-label="הגדרות">${gearIcon}</button></div>
    <h1 class="greet">${greeting()}</h1>
    <div class="today">
      <span class="chip">היום: <span class="num">${Math.min(done,settings.dailyGoal)}/${settings.dailyGoal}</span> תרגילים</span>
      <span class="chip">רצף: <span class="num">${s}</span> ${s===1?"יום":"ימים"} 🔥</span>
    </div>
    <div class="start-wrap"><button class="start" data-go="practice">התחל תרגול</button></div>
    <div class="home-bottom">
      <div class="panda-card">${panda(happy?"happy":"worried")}
        <p class="bubble">${happy ? "כל הכבוד! תרגלת היום 🎉" : "עוד לא תרגלנו היום… בוא נתחיל?"}</p></div>
      <button class="hist-btn" data-go="history">${chartIcon}היסטוריית תרגול</button>
    </div>`;
}

// ---------- practice ----------
let P = null, timerH = null;
function rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=rnd(0,i); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
// Builds the whole session up front: every exercise appears once (7×8 and 8×7 count as the same one).
// Up to 40% of the session comes from exercises he got wrong before.
function buildQueue(){
  const goal = settings.dailyGoal, pairs = [];
  for(let a=settings.minTable;a<=settings.maxTable;a++) for(let b=a;b<=settings.maxTable;b++) pairs.push([a,b]);
  shuffle(pairs);
  const isWeak = p => (mistakes[p[0]+"x"+p[1]]||0) > 0;
  const weak = pairs.filter(isWeak), rest = pairs.filter(p=>!isWeak(p));
  const nWeak = Math.min(weak.length, Math.round(goal*0.4));
  let q = [...weak.slice(0,nWeak), ...rest, ...weak.slice(nWeak)].slice(0,goal);
  shuffle(q);
  // only if the range is too small for the session length: refill, never two identical in a row
  while(q.length<goal){ const p = pairs[rnd(0,pairs.length-1)]; if(p!==q[q.length-1]) q.push(p); }
  return q.map(([a,b]) => Math.random()<.5 ? [a,b] : [b,a]);
}
function nextQ(){
  const [a,b] = P.queue[P.n];
  P.a=a; P.b=b; P.input=""; P.locked=false;
}
function startPractice(){
  P = { n:0, correct:0, start:Date.now(), wrongList:[], queue:buildQueue() };
  nextQ(); renderPractice(); startTimer();
}
function renderPractice(){
  const total = settings.dailyGoal;
  $app.innerHTML = `
    ${topbar("יאללה מייקי, תן עבודה!")}
    <div class="progress" aria-label="התקדמות"><i style="width:${P.n/total*100}%"></i></div>
    <div class="exercise num" aria-live="polite">${P.a} × ${P.b} = ?</div>
    <div class="answer num" id="ans">${P.input || "&nbsp;"}</div>
    <div class="feedback" id="fb">תרגיל <span class="num">${P.n+1}</span> מתוך <span class="num">${total}</span></div>
    <div class="keypad">
      ${[7,8,9,4,5,6,1,2,3].map(d=>`<button class="key" data-k="${d}">${d}</button>`).join("")}
      <button class="key" data-k="del" aria-label="מחק">⌫</button>
      <button class="key" data-k="0">0</button>
      <button class="key go" data-k="ok">בדוק</button>
    </div>
    ${settings.secondsPerQ ? `<div class="timer"><span class="t num" id="tt">${settings.secondsPerQ}</span><div class="bar" id="bar"><i style="width:100%"></i></div><span>שניות</span></div>` : ""}`;
}
function startTimer(){
  stopTimer(); if(!settings.secondsPerQ) return;
  P.deadline = Date.now() + settings.secondsPerQ*1000;
  timerH = setInterval(()=>{
    if(!P || P.locked) return;
    const left = Math.max(0, P.deadline-Date.now()), frac = left/(settings.secondsPerQ*1000);
    const tt=document.getElementById("tt"), bar=document.getElementById("bar");
    if(tt) tt.textContent = Math.ceil(left/1000);
    if(bar){ bar.firstElementChild.style.width = (frac*100)+"%"; bar.classList.toggle("low", frac<.3); }
    if(left<=0) check(true);
  },100);
}
function stopTimer(){ clearInterval(timerH); timerH=null; }
function press(k){
  if(!P || P.locked) return;
  if(k==="del") P.input = P.input.slice(0,-1);
  else if(k==="ok"){ if(P.input) check(false); return; }
  else if(P.input.length<3) P.input += k;
  document.getElementById("ans").innerHTML = P.input || "&nbsp;";
}
function check(timeout){
  P.locked = true;
  const right = P.a*P.b, ok = !timeout && Number(P.input)===right;
  const key = [Math.min(P.a,P.b),Math.max(P.a,P.b)].join("x");
  const ans = document.getElementById("ans"), fb = document.getElementById("fb");
  if(ok){ P.correct++; mistakes[key]=Math.max(0,(mistakes[key]||0)-1); ans.classList.add("ok"); fb.textContent = ["מעולה!","בול!","אלוף!","יפה מאוד!"][rnd(0,3)]; }
  else { mistakes[key]=(mistakes[key]||0)+1; P.wrongList.push(key.replace("x"," × ")); ans.classList.add("bad");
    ans.innerHTML = `<span class="num">${right}</span>`;
    fb.innerHTML = (timeout?"נגמר הזמן. ":"כמעט! ") + `<span class="num">${P.a} × ${P.b} = ${right}</span>`; }
  beep(ok); store.set("mk_mistakes", mistakes);
  P.n++;
  setTimeout(()=>{
    if(!P) return;
    if(P.n>=settings.dailyGoal) finish(); else { nextQ(); renderPractice(); startTimer(); }
  }, ok?800:1800);
}
function saveSession(){
  if(!P || P.n===0) return;
  const k = dayKey(daysAgo(0)), cur = history[k] && !history[k].demo ? history[k] : {total:0,correct:0,minutes:0};
  cur.total += P.n; cur.correct += P.correct; cur.minutes += Math.max(1,Math.round((Date.now()-P.start)/60000));
  history[k] = cur; store.set("mk_history", history);
}
function finish(){
  stopTimer(); saveSession();
  const pct = Math.round(P.correct/P.n*100);
  const pass = pct >= PASS_PCT, say = pass ? SAY_PASS : SAY_FAIL;
  $app.innerHTML = `
    ${topbar("סיימת!")}
    <div class="dad${pass?"":" sad"}"><img src="${pass?DAD_HAPPY:DAD_SAD}" alt="${pass?"אבא שמח":"אבא לא שמח"}"></div>
    <p class="dad-say">${say}</p>
    <p class="big-score num">${pct}%</p>
    <p class="center"><span class="num">${P.correct}</span> תשובות נכונות מתוך <span class="num">${P.n}</span></p>
    <button class="btn" data-go="practice">${pass?"עוד סבב":"עשה שוב"}</button>
    <button class="btn ghost" data-go="home">חזרה למסך הבית</button>`;
  P = null;
}

// ---------- history ----------
function renderHistory(){
  stopTimer();
  const cols=[]; let sum=0, cnt=0, anyDemo=false;
  for(let i=9;i>=0;i--){
    const d=daysAgo(i), h=history[dayKey(d)];
    const pct = h ? Math.round(h.correct/h.total*100) : null;
    if(h){ sum+=pct; cnt++; if(h.demo) anyDemo=true; }
    cols.push({label:`${d.getDate()}/${d.getMonth()+1}`, pct, today:i===0});
  }
  $app.innerHTML = `
    ${topbar("היסטוריית תרגול")}
    <div class="chart">
      <div class="bars" role="img" aria-label="ציון יומי בעשרת הימים האחרונים">
        ${cols.map(c=> c.pct===null
          ? `<div class="col"><span class="v">—</span><div class="b none"></div></div>`
          : `<div class="col"><span class="v num">${c.pct}%</span><div class="b ${c.pct<60?"low":c.pct<80?"mid":""}" style="height:${Math.max(4,c.pct*1.8)}px"></div></div>`).join("")}
      </div>
      <div class="days">${cols.map(c=>`<span class="num"${c.today?' style="color:var(--ink)"':""}>${c.today?"היום":c.label}</span>`).join("")}</div>
    </div>
    <div class="stats">
      <div class="stat"><b class="num">${cnt}/10</b>ימי תרגול</div>
      <div class="stat"><b class="num">${cnt?Math.round(sum/cnt):0}%</b>ציון ממוצע</div>
      <div class="stat"><b class="num">${streak()}</b>ימים ברצף</div>
    </div>
    ${anyDemo?`<p class="demo">חלק מהימים הם נתוני הדגמה לתצוגה המקדימה.</p>`:""}`;
}

// ---------- settings ----------
function sel(id, opts, val){ return `<select id="${id}">${opts.map(([v,l])=>`<option value="${v}"${String(v)===String(val)?" selected":""}>${l}</option>`).join("")}</select>`; }
function sw(id, on){ return `<button class="switch" role="switch" id="${id}" aria-checked="${on}"></button>`; }
function renderSettings(){
  stopTimer();
  const s = settings;
  $app.innerHTML = `
    ${topbar("הגדרות")}
    <h2 class="section-h">תרגול</h2>
    <div class="list">
      <div class="row"><label for="secondsPerQ">זמן לכל תרגיל</label>${sel("secondsPerQ",[[5,"5 שניות"],[8,"8 שניות"],[10,"10 שניות"],[15,"15 שניות"],[20,"20 שניות"],[0,"בלי הגבלה"]],s.secondsPerQ)}</div>
      <div class="row"><label for="dailyGoal">תרגילים בכל סבב</label>${sel("dailyGoal",[[10,"10"],[15,"15"],[20,"20"],[30,"30"],[40,"40"]],s.dailyGoal)}</div>
      <div class="row"><label for="minTable">מאיזה מספר<small>להשמיט את לוח ה-1 הקל</small></label>${sel("minTable",[[1,"1"],[2,"2"],[3,"3"]],s.minTable)}</div>
      <div class="row"><label for="maxTable">עד איזה מספר</label>${sel("maxTable",[[10,"10"],[12,"12"],[15,"15"]],s.maxTable)}</div>
      <div class="row"><label for="sound">צלילים</label>${sw("sound",s.sound)}</div>
    </div>
    <button class="btn" id="saveSettings">שמור הגדרות</button>`;
  $app.querySelectorAll(".switch").forEach(b=>b.addEventListener("click",()=>b.setAttribute("aria-checked", b.getAttribute("aria-checked")!=="true")));
  document.getElementById("saveSettings").addEventListener("click",()=>{
    const v=id=>document.getElementById(id);
    settings = { secondsPerQ:+v("secondsPerQ").value, dailyGoal:+v("dailyGoal").value, minTable:+v("minTable").value,
      maxTable:+v("maxTable").value, sound:v("sound").getAttribute("aria-checked")==="true" };
    store.set("mk_settings", settings); toast("ההגדרות נשמרו");
  });
}

// ---------- routing ----------
function go(view){
  if(view!=="practice" && P){ stopTimer(); saveSession(); P=null; }
  if(view==="home") renderHome();
  else if(view==="practice") startPractice();
  else if(view==="history") renderHistory();
  else if(view==="settings") renderSettings();
  window.scrollTo(0,0);
}
document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const k = e.target.closest("[data-k]"); if(k) press(k.dataset.k);
});
document.addEventListener("keydown", e=>{
  if(!P) return;
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key==="Backspace") press("del");
  else if(e.key==="Enter"){ e.preventDefault(); press("ok"); }
});
renderHome();
</script>
